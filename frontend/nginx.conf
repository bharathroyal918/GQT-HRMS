# ==============================================================================
# GQT HRMS — Frontend SPA & API Reverse Proxy Server Configuration
# Loaded by: frontend/Dockerfile -> /etc/nginx/conf.d/default.conf
# ==============================================================================

upstream backend_upstream {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum client request body size (resumes, documents, creatives)
    client_max_body_size 25M;

    # Base Security Headers (Compatible with HTTP & HTTPS terminators)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # 1. Long-Term Cache for Fingerprinted Static Assets (Vite Chunks & Bundles)
    # --------------------------------------------------------------------------
    location ~* ^/assets/.+\.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Brand assets and images
    location ~* ^/(?:images|brand)/.+\.(?:svg|png|jpg|jpeg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 2. SPA Entry Point: Never cache index.html so updates are immediate
    # --------------------------------------------------------------------------
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files /index.html =404;
    }

    # --------------------------------------------------------------------------
    # 3. Django REST Framework API Proxy (/api/)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # --------------------------------------------------------------------------
    # 4. Django Admin Interface (/admin/)
    # --------------------------------------------------------------------------
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --------------------------------------------------------------------------
    # 5. Django Admin & Framework Static Assets (/static/)
    # Served directly by Nginx from shared read-only static volume
    # --------------------------------------------------------------------------
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 6. Uploaded Media Security: Private Documents Handled via Authenticated APIs
    # Resumes, candidate rosters, offer letters, and creative assets are strictly
    # served through authenticated Django API endpoints with object-level permissions.
    # Direct static file traversal or access to /media/ is forbidden.
    # --------------------------------------------------------------------------
    location ^~ /media/ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # 7. Deny Access to Hidden Files, Source Maps, Environment Files & Databases
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(?:env|git|sqlite3|log|conf|bak|map|md|ya?ml)$ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # 8. React SPA Route Fallback (Deep Links & Client Navigation)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Safe error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
